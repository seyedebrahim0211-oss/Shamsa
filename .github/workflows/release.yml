name: Build & Release Shamsa

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Shamsa.csproj

      - name: Run Unit Tests (if present)
        shell: pwsh
        run: |
          if (Test-Path Tests/Shamsa.Tests.csproj) {
            dotnet test Tests/Shamsa.Tests.csproj -c Release
          } else {
            Write-Host "No Tests project found; skipping unit tests."
          }

      - name: Publish Portable Windows x64 Build
        run: dotnet publish Shamsa.csproj -c Release -r win-x64 --self-contained true -o ./publish

      - name: Create Portable ZIP
        run: Compress-Archive -Path ./publish/* -DestinationPath Shamsa-win-x64.zip -Force

      - name: Upload GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shamsa-win-x64.zip
          generate_release_notes: true
