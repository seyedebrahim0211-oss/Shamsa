name: Build and publish Windows 11 installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version from Shamsa.csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content Shamsa.csproj
          $v = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Restore & Build
        run: |
          dotnet restore Shamsa.csproj -r win-x64
          dotnet build Shamsa.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained win-x64
        run: |
          dotnet publish Shamsa.csproj -c Release -r win-x64 --self-contained true -o ./publish

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path ./publish/* -DestinationPath "dist/Shamsa-v${{ steps.ver.outputs.version }}-win-x64-portable.zip" -Force

      - name: Install Inno Setup & Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer/Shamsa.iss

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shamsa-v${{ steps.ver.outputs.version }}-Windows11
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Shamsa ${{ steps.ver.outputs.tag }} (Windows 10/11)
          generate_release_notes: true
          files: dist/*
